<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR MAWARAN — داواکاری خزمەت</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link rel="apple-touch-icon" href="assets/icon.png">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; }

    /* ── RTL Sidebar (same as attendance.html) ── */
    .sidebar { right: 0; left: auto; transform: translateX(100%); }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-right: 260px; margin-left: 0; }
    .topbar { flex-direction: row-reverse; }
    .topbar-title { margin-right: 12px; margin-left: 0; }
    .nav-item { flex-direction: row-reverse; text-align: right; }
    .nav-icon { margin-right: 0; margin-left: 10px; }
    .sidebar-header { flex-direction: row-reverse; }
    .sidebar-user { text-align: right; }
    .page-header { text-align: right; }
    .card-header { flex-direction: row-reverse; }
    .card-title { flex-direction: row-reverse; }
    @media (max-width: 768px) {
      .sidebar { right: 0; left: auto; transform: translateX(110%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-right: 0; }
    }
    .company-logo-img { height: 36px; width: auto; object-fit: contain; }

    /* ── Service Request Card ── */
    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      width: 100%;
      max-width: 480px;
      padding: 28px 24px 24px;
      margin: 0 auto;
    }

    .service-card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .service-card-sub {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ── Fields ── */
    .svc-field { margin-bottom: 16px; }
    .svc-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-align: right;
    }
    .svc-field input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg-secondary);
      outline: none;
      transition: border-color .15s;
      text-align: right;
    }
    .svc-field input:focus { border-color: var(--gold-500); }

    /* ── Quantity Stepper ── */
    .qty-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 12px;
    }
    .qty-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      user-select: none;
      transition: background 0.15s, transform 0.1s;
    }
    .qty-btn:active { transform: scale(0.92); background: rgba(0,0,0,0.05); }
    .qty-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 40px;
      text-align: center;
      font-family: monospace, sans-serif;
    }

    /* ── Divider ── */
    .svc-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }
    .svc-divider::before, .svc-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    /* ── Button Grid ── */
    .svc-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .svc-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      transition: transform .12s, opacity .12s, box-shadow .12s;
      position: relative;
      overflow: hidden;
    }
    .svc-btn:active { transform: scale(.96); }
    .svc-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .svc-btn .svc-emoji { font-size: 30px; line-height: 1; }
    .svc-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.18);
      opacity: 0;
      transition: opacity .2s;
    }
    .svc-btn:hover::after { opacity: 1; }

    .svc-btn-coffee { background: #6f4e37; }
    .svc-btn-tea    { background: #3a7d44; }
    .svc-btn-water  { background: #1d6fa4; }
    .svc-btn-other  { background: #c2760a; }

    /* ── Spinner inside button ── */
    @keyframes svc-spin { to { transform: rotate(360deg); } }
    .svc-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: svc-spin .7s linear infinite;
      display: none;
    }
    .svc-btn.loading .svc-spinner { display: block; }
    .svc-btn.loading .svc-emoji,
    .svc-btn.loading .svc-label  { display: none; }
  </style>
</head>
<body>

<div id="sidebarOverlay" class="sidebar-overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="assets/logo.png" alt="HR MAWARAN" class="company-logo-img"
         onerror="this.style.display='none';document.getElementById('sbLogoFallback').style.display='flex'">
    <div id="sbLogoFallback" style="display:none;align-items:center;gap:8px">
      <div class="sidebar-logo-icon">🏢</div>
      <div class="sidebar-logo-text">
        <div class="brand-name">HR MAWARAN</div>
        <div class="brand-sub">پۆرتاڵی کارمەند</div>
      </div>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-name" id="sidebarUserName">چاوەڕێبکە...</div>
    <div class="sidebar-user-role" id="sidebarUserRole">کارمەند</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">مینیوی سەرەکی</div>
    <a class="nav-item" href="profile.html"><span class="nav-icon">👤</span> پرۆفایلەکەم</a>
    <a class="nav-item" href="attendance.html"><span class="nav-icon">🕐</span> ئامادەبوون</a>
    <a class="nav-item active" href="service-request.html"><span class="nav-icon">☕</span> داواکاری خزمەت</a>
    <a class="nav-item" href="announcements.html"><span class="nav-icon">📢</span> ڕاگەیاندنەکان</a>
    <a class="nav-item" href="salary.html"><span class="nav-icon">💰</span> مووچەکەم</a>
    <a class="nav-item" href="leaves.html"><span class="nav-icon">🌴</span> مۆڵەتەکانم</a>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-ghost btn-block" data-logout>🚪 چوونەدەرەوە</button>
  </div>
</aside>

<div class="main-content">

  <header class="topbar">
    <button onclick="location.reload()"
      style="background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:var(--gold-500);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap"
      title="نوێکردنەوەی لاپەڕە">🔄</button>
    <span class="topbar-date" id="topbarDate"></span>
    <div class="topbar-spacer"></div>
    <span class="topbar-title">داواکاری خزمەت</span>
    <button class="topbar-hamburger" id="hamburger">☰</button>
  </header>

  <main class="page-content">
    <div class="page-header">
      <h1 class="page-title">داواکاری خزمەت</h1>
      <p class="page-subtitle">داواکاریەکەت بنێرە بۆ تیمی خزمەت</p>
    </div>

    <div class="service-card">
      <p class="service-card-title">بەخێربێیت 👋</p>
      <p class="service-card-sub">زانیارییەکان پڕبکەرەوە و داواکارییەکەت بنێرە</p>

      <div class="svc-field">
        <label for="empName">ناوت</label>
        <input id="empName" type="text" placeholder="نموونە: ئەحمەد عەلی" autocomplete="off" />
      </div>

      <div class="svc-field">
        <label>دانە (الكمية)</label>
        <div class="qty-stepper">
          <button type="button" class="qty-btn" onclick="changeQty(-1)">-</button>
          <span class="qty-text" id="qtyDisplay">1</span>
          <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>

      <div class="svc-divider">داواکارییەکەت هەڵبژێرە</div>

      <div class="svc-btn-grid">
        <button class="svc-btn svc-btn-coffee" onclick="sendRequest('Coffee', this)">
          <span class="svc-emoji">☕</span>
          <span class="svc-label">قاوە</span>
          <span class="svc-spinner"></span>
        </button>

        <button class="svc-btn svc-btn-tea" onclick="sendRequest('Tea', this)">
          <span class="svc-emoji">🍵</span>
          <span class="svc-label">چای</span>
          <span class="svc-spinner"></span>
        </button>

        <button class="svc-btn svc-btn-water" onclick="sendRequest('Water', this)">
          <span class="svc-emoji">💧</span>
          <span class="svc-label">ئاو</span>
          <span class="svc-spinner"></span>
        </button>

        <button class="svc-btn svc-btn-other" onclick="sendRequest('Other', this)">
          <span class="svc-emoji">📝</span>
          <span class="svc-label">داواکاری تر</span>
          <span class="svc-spinner"></span>
        </button>
      </div>
    </div>
  </main>
</div>

<script src="assets/script.js?v=4"></script>

<script>
  // ── Firebase init ──
  const firebaseConfig = {
    apiKey:            "AIzaSyC_zyJginS-_nUfFAXsAWNbYxMteOi1m3E",
    authDomain:        "company-service-6faaf.firebaseapp.com",
    projectId:         "company-service-6faaf",
    storageBucket:     "company-service-6faaf.firebasestorage.app",
    messagingSenderId: "726705809159",
    appId:             "1:726705809159:web:becb04cc61222b513c87a2",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentQty = 1; // قيمة افتراضية للكمية

  // ── Init page ──
  document.addEventListener('DOMContentLoaded', () => {
    const user = requireAuth(false);
    if (!user) return;
    startClock && startClock('topbarClock', 'topbarDate');

    // Pre-fill name from session or localStorage
    const nameInput = document.getElementById('empName');
    const savedName = user.name || localStorage.getItem('emp_name') || '';
    if (savedName) nameInput.value = savedName;

    nameInput.addEventListener('input', () => {
      localStorage.setItem('emp_name', nameInput.value.trim());
    });
  });

  // التحكم بالكمية الزيادة والنقصان
  function changeQty(amount) {
    currentQty += amount;
    if (currentQty < 1) currentQty = 1; // عدم السماح بأقل من 1
    if (currentQty > 10) currentQty = 10; // حد أقصى اختياري (10 قطع)
    document.getElementById('qtyDisplay').textContent = currentQty;
  }

  // ── Send Request ──
  let sending = false;

  async function sendRequest(type, btn) {
    const name = document.getElementById('empName').value.trim();
    if (!name) {
      Toast.warning('تێبینی', 'تکایە ناوت بنووسە');
      document.getElementById('empName').focus();
      return;
    }
    if (sending) return;
    sending = true;
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      await db.collection('requests').add({
        employee:  name,
        type:      type,
        quantity:  currentQty, // إرسال الكمية المختارة إلى فايربيس
        status:    'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      await notifyServiceStaff(name, type, currentQty);
      Toast.success('داواکاری نێردرا ✅', `${name} — ${typeLabel(type)} (×${currentQty})`);
      
      // إعادة تعيين العداد إلى 1 بعد نجاح الإرسال
      currentQty = 1;
      document.getElementById('qtyDisplay').textContent = 1;
    } catch (err) {
      console.error(err);
      Toast.error('هەڵە', 'نێردن سەرکەوتوو نەبوو، دووبارە هەوڵبدەرەوە');
    } finally {
      sending = false;
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  function typeLabel(type) {
    return { Coffee:'قاوە', Tea:'چای', Water:'ئاو', Other:'داواکاری تر' }[type] || type;
  }

  // ── FCM Notify via GAS Proxy ──
  async function notifyServiceStaff(employee, type, quantity) {
    const snap = await db.collection('fcm_tokens')
                          .where('role', '==', 'service')
                          .get();
    if (snap.empty) return;
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx4rzBnuYsYrzXRgfFYeGnkWoQUQWmFjH-IYIdEjxdHcpxyQncSf9-JgoY37QUdogpnUg/exec';
    const tokens = snap.docs.map(d => d.data().token);
    await fetch(GAS_URL, {
      method: 'POST',
      mode:   'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ 
        tokens, 
        title: 'داواکاری نوێ 🔔', 
        body: `${employee}: ${typeLabel(type)} ×${quantity}` // إضافة إشارة الضرب والكمية في الإشعار للعمال
      }),
    });
  }
</script>
</body>
</html>
